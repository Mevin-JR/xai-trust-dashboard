[project]
name = "xai-trust-dashboard"
version = "0.1.0"
description = "Interactive XAI dashboard and user-study platform comparing black-box, LIME, SHAP and plain-language explanations"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "lime>=0.2.0.1",
    "streamlit>=1.40",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
